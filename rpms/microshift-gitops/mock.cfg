# Use fedora-rawhide to match the pipeline environment image (fedora-41 may not be available there)
include("/etc/mock/fedora-rawhide-@ARCH@.cfg")

# Disable zchunk metadata to avoid "Unable to read zchunk lead" / checksum errors with Fedora mirrors.
# Inject into chroot dnf.conf so bootstrap and all DNF5 runs use it; also pass via CLI.
_dnf_conf = config_opts.get('dnf.conf', '')
if '[main]' in _dnf_conf:
    config_opts['dnf.conf'] = _dnf_conf.replace("[main]\n", "[main]\nzchunk=0\n", 1)
config_opts['dnf_options'] = ['--setopt=main.zchunk=False']